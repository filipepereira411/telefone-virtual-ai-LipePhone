            border-radius: 36px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 24px 48px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
        }
        /* Câmara Frontal do Android (Punch hole) */
        .phone::before {
            content: '';
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            background: #000;
            border-radius: 50%;
            z-index: 40;
        }
        /* Barra de Estado Android */
        .status-bar {
            height: 28px;
            background: rgba(0, 0, 0, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            font-size: 12px;
            font-weight: 500;
            z-index: 10;
        }
        .status-bar .icons {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        /* Ecrã Principal / Grelha de Apps */
        .screen {
            flex: 1;
            padding: 24px 16px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: max-content;
            gap: 20px;
            align-content: start;
        }
        /* Ícone de App (Estilo Circular Android) */
        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            text-align: center;
        }
        .app-icon .icon {
            width: 56px;
            height: 56px;
            border-radius: 50%; /* Círculos perfeitos estilo Pixel/Android */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            transition: transform 0.15s, background-color 0.2s;
        }
        .app-icon:active .icon {
            transform: scale(0.9);
            filter: brightness(0.8);
        }
        .app-icon span {
            font-size: 11px;
            font-weight: 400;
            margin-top: 8px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            color: #f5f5f5;
        }
        /* Palete Material You (Android Cores) */
        .bg-calc { background: #3f51b5; }
        .bg-notes { background: #ff9800; }
        .bg-game { background: #009688; }
        .bg-browser { background: #2196f3; }

        /* Janela da App (Material Design 3 Container) */
        .app-window {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 44px);
            background: #121212;
            z-index: 20;
            display: none;
            flex-direction: column;
            animation: androidSlideUp 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        @keyframes androidSlideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .app-header {
            height: 56px;
            background: #1f1f1f;
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid #2d2d2d;
        }
        .btn-back-android {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            margin-right: 20px;
            display: flex;
            align-items: center;
        }
        .app-header span {
            font-size: 18px;
            font-weight: 500;
        }
        .app-content {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
        }

        /* --- PROGRAMAS INTERNOS --- */
        /* Calculadora Material */
        .calc-screen {
            width: 100%;
            height: 90px;
            background: transparent;
            border: none;
            color: white;
            text-align: right;
            font-size: 2.5rem;
            padding: 10px;
            margin-bottom: 20px;
        }
        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .calc-grid button {
            padding: 18px;
            font-size: 1.3rem;
            border: none;
            border-radius: 50%; /* Botões circulares de calculadora Android */
            background: #2d2d2d;
            color: white;
            cursor: pointer;
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .calc-grid button.op {
            background: #4f5b66;
            color: #90caf9;
        }
        .calc-grid button.eq {
            background: #90caf9;
            color: #121212;
        }
        /* Bloco de Notas */
        #notes-area {
            width: 100%;
            height: 85%;
            background: #1f1f1f;
            color: white;
            border: 1px solid #2d2d2d;
            padding: 14px;
            border-radius: 12px;
            resize: none;
            font-size: 16px;
        }
        /* Jogo Clicker */
        .game-container {
            text-align: center;
            padding-top: 40px;
        }
        .click-btn {
            width: 140px;
            height: 140px;
            border-radius: 28px;
            background: #009688;
            border: none;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            margin-top: 30px;
            transition: transform 0.1s;
        }
        .click-btn:active { transform: scale(0.95); }

        /* Barra de Navegação Clássica do Android (3 botões) */
        .android-nav-bar {
            height: 44px;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 30;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .nav-btn {
            width: 44px;
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            opacity: 0.7;
        }
        .nav-btn:active { opacity: 1; }

            border-bottom: 6px solid transparent;
            border-right: 10px solid white;
        }
        .home-icon {
            width: 12px; height: 12px;
            border: 2px solid white;
            border-radius: 50%;
