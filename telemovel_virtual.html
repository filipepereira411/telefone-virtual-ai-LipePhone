<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebOS - Telemóvel HTML</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        /* Estrutura do Telemóvel */
        .phone {
            width: 360px;
            height: 740px;
            background: url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=500') no-repeat center center;
            background-size: cover;
            border: 12px solid #333;
            border-radius: 40px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        /* Barra de Estado */
        .status-bar {
            height: 30px;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 12px;
            z-index: 10;
        }

        /* Ecrã Principal / Grelha de Apps */
        .screen {
            flex: 1;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: max-content;
            gap: 20px;
            align-content: start;
        }

        /* Ícone de App */
        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            text-align: center;
        }

        .app-icon .icon {
            width: 60px;
            height: 60px;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .app-icon:active .icon {
            transform: scale(0.9);
        }

        .app-icon span {
            font-size: 11px;
            margin-top: 6px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        /* Cores dos Ícones */
        .bg-calc { background: #ff9f0a; }
        .bg-notes { background: #ffcc00; }
        .bg-game { background: #34c759; }
        .bg-browser { background: #007aff; }

        /* Janela da App (Container) */
        .app-window {
            position: absolute;
            top: 30px;
            left: 0;
            width: 100%;
            height: calc(100% - 70px);
            background: #1e1e1e;
            z-index: 20;
            display: none;
            flex-direction: column;
            animation: zoomIn 0.25s ease-out;
        }

        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .app-header {
            height: 44px;
            background: #2c2c2e;
            display: flex;
            align-items: center;
            padding: 0 15px;
            justify-content: space-between;
            border-bottom: 1px solid #3a3a3c;
        }

        .btn-back {
            background: none;
            border: none;
            color: #007aff;
            font-size: 16px;
            cursor: pointer;
        }

        .app-content {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }

        /* --- CÓDIGO DOS PROGRAMAS INTERNOS --- */
        
        /* Calculadora */
        .calc-screen {
            width: 100%;
            height: 60px;
            background: #000;
            border: none;
            color: white;
            text-align: right;
            font-size: 2rem;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
        }
        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .calc-grid button {
            padding: 15px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            background: #3a3a3c;
            color: white;
            cursor: pointer;
        }
        .calc-grid button.op { background: #ff9f0a; }

        /* Bloco de Notas */
        #notes-area {
            width: 100%;
            height: 80%;
            background: #2c2c2e;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            resize: none;
            font-size: 16px;
        }

        /* Jogo Clicker */
        .game-container {
            text-align: center;
            padding-top: 40px;
        }
        .click-btn {
            width: 120px;
            height: 120px;
            border-radius: 60px;
            background: #34c759;
            border: none;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            margin-top: 20px;
        }

        /* Barra de Navegação Inferior (Botão Home) */
        .nav-bar {
            height: 40px;
            background: rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 30;
        }

        .home-button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="phone">
        <!-- Barra de Estado -->
        <div class="status-bar">
            <span id="clock">12:00</span>
            <span>📶 🔋 100%</span>
        </div>

        <!-- Ecrã Principal com os Programas -->
        <div class="screen">
            <div class="app-icon" onclick="openApp('calc-app')">
                <div class="icon bg-calc">🧮</div>
                <span>Calculadora</span>
            </div>
            <div class="app-icon" onclick="openApp('notes-app')">
                <div class="icon bg-notes">📝</div>
                <span>Notas</span>
            </div>
            <div class="app-icon" onclick="openApp('game-app')">
                <div class="icon bg-game">🎮</div>
                <span>Clicker</span>
            </div>
            <div class="app-icon" onclick="openApp('browser-app')">
                <div class="icon bg-browser">🌐</div>
                <span>Navegador</span>
            </div>
        </div>

        <!-- JANELA: Calculadora -->
        <div id="calc-app" class="app-window">
            <div class="app-header">
                <button class="btn-back" onclick="closeApp()">✕</button>
                <span>Calculadora</span>
                <div style="width:20px;"></div>
            </div>
            <div class="app-content">
                <input type="text" id="calc-display" class="calc-screen" readonly value="0">
                <div class="calc-grid">
                    <button onclick="clearCalc()">C</button>
                    <button class="op" onclick="pressOp('/')">/</button>
                    <button class="op" onclick="pressOp('*')">×</button>
                    <button class="op" onclick="pressOp('-')">-</button>
                    <button onclick="pressNum('7')">7</button>
                    <button onclick="pressNum('8')">8</button>
                    <button onclick="pressNum('9')">9</button>
                    <button class="op" rowspan="2" onclick="pressOp('+')" style="grid-row: span 2; height: 100%;">+</button>
                    <button onclick="pressNum('4')">4</button>
                    <button onclick="pressNum('5')">5</button>
                    <button onclick="pressNum('6')">6</button>
                    <button onclick="pressNum('1')">1</button>
                    <button onclick="pressNum('2')">2</button>
                    <button onclick="pressNum('3')">3</button>
                    <button onclick="calculate()" style="grid-column: span 2; background: #ff9f0a;">=</button>
                    <button onclick="pressNum('0')">0</button>
                    <button onclick="pressNum('.')">.</button>
                </div>
            </div>
        </div>

        <!-- JANELA: Notas -->
        <div id="notes-app" class="app-window">
            <div class="app-header">
                <button class="btn-back" onclick="closeApp()">✕</button>
                <span>Bloco de Notas</span>
                <div style="width:20px;"></div>
            </div>
            <div class="app-content">
                <textarea id="notes-area" placeholder="Começa a escrever aqui..."></textarea>
            </div>
        </div>

        <!-- JANELA: Jogo Clicker -->
        <div id="game-app" class="app-window">
            <div class="app-header">
                <button class="btn-back" onclick="closeApp()">✕</button>
                <span>Clicker Game</span>
                <div style="width:20px;"></div>
            </div>
            <div class="app-content game-container">
                <h2>Pontos: <span id="score">0</span></h2>
                <button class="click-btn" onclick="addPoint()">Clica-me!</button>
            </div>
        </div>

        <!-- JANELA: Navegador Falso -->
        <div id="browser-app" class="app-window">
            <div class="app-header">
                <button class="btn-back" onclick="closeApp()">✕</button>
                <span>Navegador Web</span>
                <div style="width:20px;"></div>
            </div>
            <div class="app-content" style="display:flex; flex-direction:column; gap:10px;">
                <input type="text" value="https://www.google.pt" style="width:100%; padding:8px; border-radius:5px; border:none; background:#3a3a3c; color:white;" readonly>
                <div style="flex:1; background:white; color:black; padding:20px; border-radius:8px; text-align:center;">
                    <h3 style="margin-top:40px;">Google</h3>
                    <p style="color:#666; font-size:14px; margin-top:10px;">Ligado à Internet Simulada</p>
                </div>
            </div>
        </div>

        <!-- Barra do Botão Home -->
        <div class="nav-bar">
            <div class="home-button" onclick="closeApp()"></div>
        </div>
    </div>

    <script>
        // Relógio Dinâmico
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').innerText = hours + ':' + minutes;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Sistema de Janelas (Abrir/Fechar Apps)
        let activeApp = null;
        function openApp(appId) {
            if (activeApp) closeApp();
            activeApp = document.getElementById(appId);
            activeApp.style.display = 'flex';
        }
        function closeApp() {
            if (activeApp) {
                activeApp.style.display = 'none';
                activeApp = null;
            }
        }

        // Lógica da Calculadora
        let calcDisplay = document.getElementById('calc-display');
        function pressNum(num) {
            if (calcDisplay.value === '0') calcDisplay.value = num;
            else calcDisplay.value += num;
        }
        function pressOp(op) {
            calcDisplay.value += op;
        }
        function clearCalc() {
            calcDisplay.value = '0';
        }
        function calculate() {
            try {
                calcDisplay.value = eval(calcDisplay.value);
            } catch {
                calcDisplay.value = 'Erro';
            }
        }

        // Lógica do Jogo Clicker
        let score = 0;
        function addPoint() {
            score++;
            document.getElementById('score').innerText = score;
        }
    </script>
</body>
</html>
